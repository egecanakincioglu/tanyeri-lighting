version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    # Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'ci'
  - package-ecosystem: 'docker'
    directory: '/tooling/ci-images'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Local data volumes only stay compatible within one PostgreSQL major.
      - dependency-name: 'postgres'
        update-types:
          - 'version-update:semver-major'
    commit-message:
      prefix: 'build'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Wait until typescript-eslint and Next.js support the next TypeScript major.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # Stay on Prisma 7: the auth library supports up to 7.
      - dependency-name: 'prisma'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@prisma/*'
        update-types:
          - 'version-update:semver-major'
      # @types/node follows the Node runtime major (see .node-version).
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    commit-message:
      prefix: 'build'
