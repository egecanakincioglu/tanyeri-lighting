name: ci

# Pull request title/description checks live in pr-text.yml (they also run on `edited`).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # All merge-rule checks in one job. Every step runs even when an earlier one failed, so a single run reports
  # every violation. Dependabot commits can not follow our branch/message conventions, so those steps are
  # skipped for it; the rest runs for everyone.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Branch name
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: tooling/scripts/check-branch-name.sh "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
      - name: Validate every commit message in the pull request
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            msg="$(git log -1 --format=%B "$sha")"
            if ! printf '%s\n' "$msg" | tooling/scripts/check-commit-msg.sh - || ! printf '%s\n' "$msg" | tooling/scripts/check-forbidden-terms.sh --text -; then
              echo "::error::invalid commit message in $sha"
              status=1
            fi
          done
          exit $status
      # A stolen device or token can not forge the owner's commits. Runs for everyone, including Dependabot
      # (GitHub signs those commits itself).
      - name: Every commit in the pull request is verified by GitHub
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/check-signed-commits.ts
      - name: Source changes come with tests
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/check-untested-code.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Coverage thresholds only go up
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/check-coverage-thresholds.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Site audit thresholds only tighten
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/check-site-audit-thresholds.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Version bumps come with a changelog entry and only go up
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/check-release-version.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Doc links
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-doc-links.ts
      - name: Docs are English and have ASCII kebab-case names
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-docs-language.ts
      - name: packageManager is pinned to an exact version with a hash
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-package-manager.ts
      # The check parses the sources with the TypeScript compiler, so it needs the installed dependencies.
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Admin pages, handlers and Server Actions call the session guard
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-admin-guard.ts
      - name: Scan tracked files and paths for forbidden terms
        if: ${{ !cancelled() }}
        run: tooling/scripts/check-forbidden-terms.sh --all
      - name: Scan tracked paths for forbidden files
        if: ${{ !cancelled() }}
        run: tooling/scripts/check-forbidden-paths.sh --all
      - name: Scan full history for leaked secrets
        if: ${{ !cancelled() }}
        run: |
          image="$(node tooling/scripts/ci-image.ts gitleaks)"
          docker run --rm -v "$PWD:/repo" "$image" git /repo --redact --verbose

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      # Every step runs even when an earlier one failed, so one run reports every violation.
      - name: Type check
        run: pnpm typecheck
      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm format:check
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Semgrep rule tests
        if: ${{ !cancelled() }}
        run: |
          image="$(node tooling/scripts/ci-image.ts semgrep)"
          docker run --rm -v "$PWD:/src" -w /src "$image" semgrep --test --metrics=off tooling/semgrep
      - name: Semgrep scan
        if: ${{ !cancelled() }}
        run: |
          image="$(node tooling/scripts/ci-image.ts semgrep)"
          docker run --rm -v "$PWD:/src" -w /src "$image" semgrep scan --config tooling/semgrep --exclude tooling/semgrep --exclude src/generated --error --metrics=off
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-audit.ts
      - name: Production licenses
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-licenses.ts
      - name: Dead code and unused dependencies
        if: ${{ !cancelled() }}
        run: pnpm knip

  # The community rulesets of the Semgrep registry. The tool is pinned by digest, the rules are not: the registry
  # serves its current version at run time, so a new rule can turn this job red without a change in the repository.
  # Kept apart from `quality` so that such a failure is easy to tell from a failure of our own checks.
  semgrep-registry:
    name: semgrep-registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Semgrep registry scan
        run: |
          image="$(node tooling/scripts/ci-image.ts semgrep)"
          docker run --rm -v "$PWD:/src" -w /src "$image" semgrep scan --config p/typescript --config p/react --config p/nodejs --config p/owasp-top-ten --config p/security-audit --exclude tooling/semgrep --exclude src/generated --error --metrics=off

  # Audits the workflow files and the Dependabot config for security problems. Medium severity and above fail.
  # The online audits (impostor commits, known vulnerable actions) call the GitHub API with the job's read-only token.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="$(node tooling/scripts/ci-image.ts zizmor)"
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo "$image" --no-progress --min-severity medium .github

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL
        run: pnpm db:up
      - name: Tests with coverage
        run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  site-audit:
    name: site-audit (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DEMO_MODE: 'true'
      # The pages read the database, so the audit runs against the demo content. These values protect nothing.
      DATABASE_URL: postgresql://postgres@localhost:5432/tanyeri
      DATABASE_URL_UNPOOLED: postgresql://postgres@localhost:5432/tanyeri
      BETTER_AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      BETTER_AUTH_URL: http://localhost:3000
    strategy:
      fail-fast: false
      matrix:
        leg: [pages, mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL
        run: pnpm db:up
      - name: Create the tables and the demo content
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed:demo
      - name: Build
        run: pnpm build
      - name: Site audit
        run: pnpm site-audit --leg ${{ matrix.leg }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-audit-${{ matrix.leg }}
          path: site-audit-report
          retention-days: 7

  tooling-linux:
    name: tooling (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The admin guard check parses sources with the TypeScript compiler.
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Unit tests of the tooling
        run: node --test "tooling/**/*.test.ts"
      # Syntax check of every shell script and of the extensionless git hooks.
      - name: Shell syntax
        run: |
          set -euo pipefail
          { find tooling -name '*.sh'; find tooling/git-hooks -type f ! -name '*.*'; } | while IFS= read -r f; do
            bash -n "$f"
          done

  tooling-windows:
    name: tooling (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Git Bash on the runner, the same shell the tooling targets on a developer's Windows machine.
      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Unit tests of the tooling
        shell: bash
        run: node --test "tooling/**/*.test.ts"
