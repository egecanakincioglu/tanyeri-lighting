rules:
  - id: no-hardcoded-secret
    languages: [typescript]
    severity: ERROR
    message: Do not hard-code secrets; read them from the environment.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: const $NAME = "$VALUE"
              - pattern: let $NAME = "$VALUE"
              - pattern: $OBJ.$NAME = "$VALUE"
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(key|token|secret|password|apikey).*
          - metavariable-regex:
              metavariable: $VALUE
              regex: .+
      - patterns:
          - pattern: |
              { $NAME: "$VALUE" }
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(key|token|secret|password|apikey).*
          - metavariable-regex:
              metavariable: $VALUE
              regex: .+
    paths:
      exclude:
        - '*.test.ts'
        - '*.test.tsx'
